[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "kontur2-sprint0"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["ifcopenshell==0.8.5", "numpy>=1.26,<3"]
[project.optional-dependencies]
test = ["pytest>=8,<10"]
[project.scripts]
ifc-sprint0 = "converter.cli:main"
[tool.setuptools.packages.find]
include = ["converter*", "worker*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
